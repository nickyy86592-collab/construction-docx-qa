name: Word stage page measurement
on:
  push:
    branches: [main]
    paths: ['input/project/*页数硬审*.py', 'input/project/stage-40.docx', 'input/project/stage-75.docx', 'audit/common/**', '.github/workflows/word-stage-measure.yml']
  workflow_dispatch:
    inputs:
      stage_percent:
        description: 'Stage percentage'
        required: true
        type: choice
        options: ['40', '75']
        default: '40'
permissions:
  contents: read
concurrency:
  group: word-stage-measure
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          ready=$(python audit/common/runner_audit.py --mode stage --project-dir input/project --check-ready)
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "STAGE_INPUT_READY=$ready"
  measure:
    needs: inputs
    if: needs.inputs.outputs.ready == 'true'
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stage-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
      REQUESTED_STAGE: ${{ inputs.stage_percent }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: stage-${{ github.run_id }}
      - name: Prepare cached Python and Word COM
        shell: powershell
        run: audit/common/prepare_python.ps1
      - name: Measure existing stage snapshots with current project page rules
        shell: powershell
        run: |
          $argsList = @('audit/common/runner_audit.py','--mode','stage','--project-dir','input/project','--outdir','output/project')
          if ($env:REQUESTED_STAGE) { $argsList += @('--stage',$env:REQUESTED_STAGE) }
          & $env:AUDIT_PYTHON @argsList
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-stage-${{ github.run_id }}
          path: stage-${{ github.run_id }}/output/project/
          if-no-files-found: warn
