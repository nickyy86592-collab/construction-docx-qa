name: Isolated Microsoft Word layout
on:
  push:
    branches: [word-layout-session-d9d7e27d]
    paths: ['bridge/start/**']
permissions:
  contents: read
concurrency:
  group: isolated-word-layout
  cancel-in-progress: true
jobs:
  transport:
    if: github.actor == 'nickyy86592-collab'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: word-layout-scripts-${{ github.run_id }}
          path: |
            bridge/word_layout.ps1
            bridge/render_word.py
            audit/common/prepare_python.ps1
          retention-days: 1
          if-no-files-found: error
  word:
    needs: transport
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 9
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: word-layout-scripts-${{ github.run_id }}
          path: relay-${{ github.run_id }}
      - name: Publish this run's ephemeral public key
        shell: powershell
        run: |
          & ./relay-${{ github.run_id }}/audit/common/prepare_python.ps1
          & ./relay-${{ github.run_id }}/bridge/word_layout.ps1 -Mode offer
      - uses: actions/upload-artifact@v4
        with:
          name: word-layout-receiver-${{ github.run_id }}
          path: ${{ runner.temp }}/word-layout-${{ github.run_id }}/receiver.json
          retention-days: 1
          if-no-files-found: error
      - name: Measure and save with Microsoft Word
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./relay-${{ github.run_id }}/bridge/word_layout.ps1 -Mode measure
      - uses: actions/upload-artifact@v4
        with:
          name: word-layout-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/word-layout-${{ github.run_id }}/proof.bin
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary files
        if: always()
        shell: powershell
        run: |
          $directory = Join-Path $env:RUNNER_TEMP ("word-layout-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $directory) { Remove-Item -LiteralPath $directory -Recurse -Force }
