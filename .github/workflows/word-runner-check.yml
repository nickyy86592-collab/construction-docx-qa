name: Windows Word runner connection check
on:
  workflow_dispatch:

jobs:
  word-connection:
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify interactive Microsoft Word and page count
        id: wordtest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $word = $null
          $doc = $null
          try {
            $word = New-Object -ComObject Word.Application
            $word.Visible = $false
            $word.DisplayAlerts = 0
            $doc = $word.Documents.Add()
            $doc.Content.Text = 'Word runner connection check'
            $doc.Repaginate()
            $pages = $doc.ComputeStatistics(2)
            if ($pages -lt 1) { throw "Word returned invalid page count: $pages" }
            Write-Host "PASS: Microsoft Word $($word.Version); sample document pages = $pages"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "word_version=$($word.Version)"
            Add-Content -Path $env:GITHUB_OUTPUT -Value "sample_pages=$pages"
          }
          finally {
            if ($null -ne $doc) {
              $doc.Close(0)
              [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($doc)
            }
            if ($null -ne $word) {
              $word.Quit()
              [void][System.Runtime.InteropServices.Marshal]::FinalReleaseComObject($word)
            }
          }
      - name: Record result in private repository
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.wordtest.outcome }}
          WORD_VERSION: ${{ steps.wordtest.outputs.word_version }}
          SAMPLE_PAGES: ${{ steps.wordtest.outputs.sample_pages }}
        run: |
          $ErrorActionPreference = 'Stop'
          $result = @{
            status = $env:TEST_OUTCOME
            word_version = $env:WORD_VERSION
            sample_pages = $env:SAMPLE_PAGES
            run_id = $env:GITHUB_RUN_ID
            checked_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Compress
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/word-runner-connection-result.json"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            message = 'Record Word runner connection result'
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($result))
            branch = 'main'
          }
          try {
            $current = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            if ($current.sha) { $body.sha = $current.sha }
          }
          catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          $json = $body | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri $uri -Headers $headers -Method Put -ContentType 'application/json' -Body $json | Out-Null
