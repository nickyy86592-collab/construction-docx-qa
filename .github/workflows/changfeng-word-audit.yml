name: Changfeng Word formal delivery audit
on:
  push:
    branches: [main]
    paths: ['input/changfeng/design.docx', 'input/changfeng/format_rules.json', 'audit/changfeng/**', '.github/workflows/changfeng-word-audit.yml']
  workflow_dispatch:
    inputs:
      photo_stage:
        description: 'Photo stage: draft placeholders or final verified photos'
        required: true
        type: choice
        options:
          - draft
          - final
        default: draft
permissions:
  contents: read
concurrency:
  group: changfeng-word-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: audit-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit-${{ github.run_id }}
      - name: Prepare isolated Python and Word COM
        id: runtime
        shell: powershell
        run: audit/changfeng/prepare_python.ps1
      - name: Run synchronized project hard audits
        id: audits
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force output/changfeng | Out-Null
          & $env:AUDIT_PYTHON audit/changfeng/page_gate.py input/changfeng/design.docx --report output/changfeng/pages.json
          $pageExit = $LASTEXITCODE
          $rulesPath = "audit/changfeng/rules.json"
          if (Test-Path "input/changfeng/format_rules.json") {
            $rulesPath = "input/changfeng/format_rules.json"
          }
          $rules = Get-Content $rulesPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $rules | Add-Member -NotePropertyName photo_delivery_stage -NotePropertyValue '${{ inputs.photo_stage }}' -Force
          }
          $photoStage = [string]$rules.photo_delivery_stage
          $rulesPath = "output/changfeng/effective-format-rules.json"
          $rules | ConvertTo-Json -Depth 30 | Set-Content $rulesPath -Encoding UTF8
          # Convert Windows PowerShell BOM to UTF-8 without BOM for shared Python scripts.
          & $env:AUDIT_PYTHON -c "from pathlib import Path; p=Path('$rulesPath'); p.write_text(p.read_text(encoding='utf-8-sig'),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:AUDIT_PYTHON audit/changfeng/check_mandatory_rules.py $rulesPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "PHOTO_DELIVERY_STAGE=$photoStage"
          Write-Host "FORMAT_RULES_PATH=$rulesPath"
          & $env:AUDIT_PYTHON audit/changfeng/delivery_gate.py input/changfeng/design.docx --rules $rulesPath --static-only --report output/changfeng/static.json
          $staticExit = $LASTEXITCODE
          & $env:AUDIT_PYTHON audit/changfeng/delivery_gate.py input/changfeng/design.docx --rules $rulesPath --report output/changfeng/delivery.json
          $deliveryExit = $LASTEXITCODE
          "page_exit=$pageExit static_exit=$staticExit delivery_exit=$deliveryExit" | Set-Content output/changfeng/exit-codes.txt
          if ($pageExit -ne 0 -or $staticExit -ne 0 -or $deliveryExit -ne 0) { exit 1 }
      - name: Export actual Microsoft Word layout
        if: (success() || failure()) && steps.runtime.outcome == 'success'
        shell: powershell
        run: |
          & $env:AUDIT_PYTHON audit/changfeng/export_pdf.py input/changfeng/design.docx output/changfeng/design-word.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changfeng-word-audit-${{ github.run_id }}
          path: audit-${{ github.run_id }}/output/changfeng/
          if-no-files-found: error

