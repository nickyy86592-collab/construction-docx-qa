name: Changfeng Word formal delivery audit
on:
  push:
    branches: [main]
    paths: ['input/changfeng/**', 'audit/changfeng/**', '.github/workflows/changfeng-word-audit.yml']
  workflow_dispatch:
    inputs:
      photo_stage:
        description: '实景图阶段：draft允许规范占位，final要求已替换'
        required: true
        type: choice
        options:
          - draft
          - final
        default: draft
permissions:
  contents: read
concurrency:
  group: changfeng-word-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: audit-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit-${{ github.run_id }}
      - name: Prepare isolated Python and Word COM
        id: runtime
        shell: powershell
        run: audit/changfeng/prepare_python.ps1
      - name: Run original project hard audits
        id: audits
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force output/changfeng | Out-Null
          & $env:AUDIT_PYTHON audit/changfeng/page_gate.py input/changfeng/design.docx --report output/changfeng/pages.json
          $pageExit = $LASTEXITCODE
          # 真实页数合格区间仅从独立 page_gate.py 读取（本项目正文49–51页）。
          # 不另设“≤50页”的第二套规则，以免与 ±1 的唯一页数来源冲突。
          $photoStage = "${{ inputs.photo_stage }}"
          if ($photoStage -ne "final") { $photoStage = "draft" }
          $rulesPath = "audit/changfeng/rules.json"
          # 如本项目生成了格式参数快照，可使用它；页数目标仍不在此规则文件中。
          if (Test-Path "input/changfeng/format_rules.json") {
            $rulesPath = "input/changfeng/format_rules.json"
          }
          Write-Host "PHOTO_DELIVERY_STAGE=$photoStage"
          Write-Host "FORMAT_RULES_PATH=$rulesPath"
          & $env:AUDIT_PYTHON audit/changfeng/delivery_gate.py input/changfeng/design.docx --rules $rulesPath --photo-stage $photoStage --report output/changfeng/delivery.json
          $deliveryExit = $LASTEXITCODE
          "page_exit=$pageExit delivery_exit=$deliveryExit" | Set-Content output/changfeng/exit-codes.txt
          if ($pageExit -ne 0 -or $deliveryExit -ne 0) { exit 1 }
      - name: Export actual Microsoft Word layout
        if: (success() || failure()) && steps.runtime.outcome == 'success'
        shell: powershell
        run: |
          & $env:AUDIT_PYTHON audit/changfeng/export_pdf.py input/changfeng/design.docx output/changfeng/design-word.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changfeng-word-audit-${{ github.run_id }}
          path: audit-${{ github.run_id }}/output/changfeng/
          if-no-files-found: error
