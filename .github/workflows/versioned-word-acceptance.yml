name: Versioned synthetic Windows Word acceptance
on:
  push:
    branches: [release-r22.6-r23.6]
    paths:
      - '.github/workflows/versioned-word-acceptance.yml'
      - 'automation/versioned-word-acceptance/**'
      - 'skills/general-construction-organization-writing-r22-6/**'
      - 'skills/general-construction-organization-writing-r23-6/**'

permissions:
  contents: read

concurrency:
  group: versioned-word-acceptance
  cancel-in-progress: true

jobs:
  synthetic-code:
    if: github.repository == 'nickyy86592-collab/construction-docx-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: versioned-word-synthetic-code-${{ github.run_id }}
          path: |
            audit/common/prepare_python.ps1
            automation/versioned-word-acceptance/verify.py
            skills/general-construction-organization-writing-r22-6/release-profile.json
            skills/general-construction-organization-writing-r22-6/scripts/
            skills/general-construction-organization-writing-r22-6/production/
            skills/general-construction-organization-writing-r23-6/release-profile.json
            skills/general-construction-organization-writing-r23-6/scripts/
            skills/general-construction-organization-writing-r23-6/production/
          retention-days: 1
          if-no-files-found: error

  native-word:
    needs: synthetic-code
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versioned-word-synthetic-code-${{ github.run_id }}
          path: versioned-word-${{ github.run_id }}
      - name: Prepare Windows Word COM dependencies
        shell: powershell
        working-directory: versioned-word-${{ github.run_id }}
        run: ./audit/common/prepare_python.ps1
      - name: Verify exact versions and actual Word pages
        shell: powershell
        working-directory: versioned-word-${{ github.run_id }}
        run: |
          & $env:AUDIT_PYTHON -X utf8 automation/versioned-word-acceptance/verify.py
          exit $LASTEXITCODE
