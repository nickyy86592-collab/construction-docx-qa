name: DOCX PDF page preflight
on:
  push:
    branches: [main]
    paths: ['pdf_page_gate.py', 'smoke_test.py', '.github/workflows/docx-pdf-page-check.yml']
  workflow_dispatch:
    inputs:
      docx_path:
        description: 'Path to runtime DOCX in this repository'
        required: true
        type: string
      page_dir:
        description: 'Directory containing the unique current project page-audit script'
        required: true
        default: input/project
        type: string
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer, Chinese fonts and test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk fonts-wqy-microhei python3-docx
          fc-cache -f
      - name: Test project script driven PDF estimates
        run: python3 smoke_test.py
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice, Poppler and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk fonts-wqy-microhei
          fc-cache -f
      - name: Render and count with current project page rules
        id: check
        continue-on-error: true
        env:
          DOCX_PATH: ${{ inputs.docx_path }}
          PAGE_RULE_DIR: ${{ inputs.page_dir }}
        run: python3 pdf_page_gate.py "$DOCX_PATH" --page-dir "$PAGE_RULE_DIR" --outdir qa-output
      - name: Upload PDF and estimate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docx-pdf-page-preflight
          path: qa-output/
          if-no-files-found: warn
      - name: Mark estimated page gate
        if: steps.check.outcome != 'success'
        run: exit 1
