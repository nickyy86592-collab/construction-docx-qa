name: Changfeng Word stage page measurement
on:
  push:
    branches: [main]
    paths:
      - 'input/changfeng/stage-40.docx'
      - 'input/changfeng/stage-75.docx'
      - 'input/changfeng/stage_request.json'
  workflow_dispatch:
    inputs:
      stage_percent:
        description: 'Stage percentage'
        required: true
        type: choice
        options: ['40', '75']
        default: '40'
permissions:
  contents: read
concurrency:
  group: changfeng-word-stage-measure
  cancel-in-progress: false
jobs:
  measure:
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stage-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: stage-${{ github.run_id }}
      - name: Prepare isolated Python and Word COM
        id: runtime
        shell: powershell
        run: audit/changfeng/prepare_python.ps1
      - name: Resolve stage input
        shell: powershell
        env:
          GH_STAGE_TOKEN: ${{ github.token }}
        run: |
          $stage = ''
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $stage = '${{ inputs.stage_percent }}'
          } else {
            $headers = @{Authorization="Bearer $env:GH_STAGE_TOKEN"; Accept='application/vnd.github+json'}
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA"
            $commit = Invoke-RestMethod -Uri $uri -Headers $headers
            $changed = @($commit.files | ForEach-Object { $_.filename })
            if ($changed -contains 'input/changfeng/stage_request.json') {
              $request = Get-Content input/changfeng/stage_request.json -Raw -Encoding UTF8 | ConvertFrom-Json
              $stage = [string]$request.stage_percent
            } else {
              $has40 = $changed -contains 'input/changfeng/stage-40.docx'
              $has75 = $changed -contains 'input/changfeng/stage-75.docx'
              if ($has40 -and $has75) { throw 'Both stage snapshots changed. Use separate commits.' }
              if ($has40) { $stage = '40' }
              if ($has75) { $stage = '75' }
            }
          }
          if ($stage -notin @('40','75')) { throw 'Invalid or missing stage percentage.' }
          $doc = "input/changfeng/stage-$stage.docx"
          if (-not (Test-Path $doc)) { throw "Missing stage snapshot: $doc" }
          "STAGE_PERCENT=$stage" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "STAGE_DOC=$doc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "STAGE_PERCENT=$stage"
          Write-Host "STAGE_DOC=$doc"
      - name: Measure with Microsoft Word
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force output/changfeng | Out-Null
          $json = "output/changfeng/stage-$env:STAGE_PERCENT-word-pages.json"
          $txt = "output/changfeng/stage-$env:STAGE_PERCENT-word-pages.txt"
          & $env:AUDIT_PYTHON audit/changfeng/stage_measure.py $env:STAGE_DOC --stage-percent $env:STAGE_PERCENT --report $json --text-report $txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changfeng-word-stage-${{ env.STAGE_PERCENT }}-${{ github.run_id }}
          path: stage-${{ github.run_id }}/output/changfeng/
          if-no-files-found: error
