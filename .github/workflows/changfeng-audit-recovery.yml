name: Recover superseded Changfeng audit runs
on:
  push:
    paths: ['.github/workflows/changfeng-audit-recovery.yml']
permissions:
  actions: write
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Release stale audit queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error
          for run_id in [36662113155,36662456875]:
              url=f'https://api.github.com/repos/{os.environ["GH_REPO"]}/actions/runs/{run_id}/force-cancel'
              req=urllib.request.Request(url,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req) as response: print(run_id,response.status)
              except urllib.error.HTTPError as error:
                  print(run_id,error.code)
                  if error.code!=409: raise
          PY
