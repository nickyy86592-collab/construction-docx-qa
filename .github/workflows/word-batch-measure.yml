name: Word construction batch measurement
on:
  push:
    branches: [main]
    paths: ['input/batch/**', 'audit/batch/**', '.github/workflows/word-batch-measure.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: word-construction-batch
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: batch-input-${{ github.run_id }}
          path: |
            audit/common/
            audit/batch/
            input/batch/
          if-no-files-found: error
  measure:
    needs: inputs
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: batch-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: batch-input-${{ github.run_id }}
          path: batch-${{ github.run_id }}
      - name: Prepare cached Python and Word COM
        shell: powershell
        run: audit/common/prepare_python.ps1
      - name: Measure batch with Microsoft Word and export PDF
        shell: powershell
        run: |
          & $env:AUDIT_PYTHON audit/batch/batch_measure.py --document input/batch/batch.docx --outdir output/batch
          exit $LASTEXITCODE
      - name: Preserve Word measurement before full format audit
        uses: actions/upload-artifact@v4
        with:
          name: word-batch-measure-${{ github.run_id }}
          path: batch-${{ github.run_id }}/output/batch/batch-word.*
          if-no-files-found: error
      - name: Audit first-batch format with Microsoft Word
        shell: powershell
        run: |
          & $env:AUDIT_PYTHON audit/batch/formal_audit.py input/batch/batch.docx --rules input/batch/format_rules.json --page-dir input/batch/page_rule --report output/batch/format-word.json --evidence-dir output/batch/format-evidence
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-batch-${{ github.run_id }}
          path: batch-${{ github.run_id }}/output/batch/
          if-no-files-found: warn
