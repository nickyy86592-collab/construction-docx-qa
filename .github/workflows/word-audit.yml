name: Word formal delivery audit
on:
  push:
    branches: [main]
    paths: ['input/project/**', 'audit/common/**', '.github/workflows/word-audit.yml']
  workflow_dispatch:
    inputs:
      photo_stage:
        description: 'auto follows project rules; draft placeholders or final verified photos'
        required: true
        type: choice
        options: [auto, draft, final]
        default: auto
permissions:
  contents: read
  actions: read
concurrency:
  group: word-formal-audit
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          ready=$(python audit/common/runner_audit.py --mode formal --project-dir input/project --check-ready)
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "FORMAL_INPUT_READY=$ready"
      - name: Stage pinned artifact transport
        if: steps.ready.outputs.ready == 'true'
        shell: python
        run: |
          import urllib.request,zipfile,io,hashlib,json
          from pathlib import Path
          pin='ea165f8d65b6e75b540449e92b4886f43607fa02'
          with urllib.request.urlopen('https://api.github.com/repos/actions/upload-artifact/zipball/'+pin,timeout=60) as r:
              raw=r.read()
          manifest={}
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in ['action.yml','dist/upload/index.js']:
                  found=[x for x in z.namelist() if '/'.join(x.split('/')[1:])==name]
                  assert len(found)==1
                  p=Path('upload-action')/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(found[0]))
                  manifest[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('transport-manifest.json').write_text(json.dumps(manifest))
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          name: word-audit-input-${{ github.run_id }}
          path: |
            audit/common/
            input/project/
            upload-action/
            transport-manifest.json
          if-no-files-found: error
  audit:
    needs: inputs
    if: needs.inputs.outputs.ready == 'true'
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: audit-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
      PHOTO_STAGE: ${{ inputs.photo_stage || 'auto' }}
    steps:
      - name: Receive the verified Word audit input artifact
        id: transfer
        working-directory: ${{ github.workspace }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $root = Join-Path $env:GITHUB_WORKSPACE "audit-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $headers = @{Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"}
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts"
          $list = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 45
          $artifact = $list.artifacts | Where-Object {$_.name -eq "word-audit-input-$env:GITHUB_RUN_ID"} | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Word audit input artifact missing' }
          $zip = Join-Path $root 'input.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $artifact.archive_download_url -Headers $headers -OutFile $zip -TimeoutSec 90
          if ($artifact.digest -and $artifact.digest -ne ('sha256:' + (Get-FileHash -Path $zip).Hash.ToLowerInvariant())) {
            throw 'Word audit input artifact digest mismatch'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $manifest = Get-Content -Raw -Encoding UTF8 (Join-Path $root 'transport-manifest.json') | ConvertFrom-Json
          foreach ($entry in $manifest.PSObject.Properties) {
            if ((Get-FileHash (Join-Path $root $entry.Name)).Hash.ToLowerInvariant() -ne $entry.Value) {
              throw 'Pinned artifact uploader digest mismatch'
            }
          }
          $uploader = Join-Path $env:GITHUB_WORKSPACE '_word_audit_upload'
          New-Item -ItemType Directory -Force -Path $uploader | Out-Null
          Copy-Item -Path (Join-Path $root 'upload-action/*') -Destination $uploader -Recurse -Force
      - name: Prepare cached Python and Word COM
        id: runtime
        shell: powershell
        run: audit/common/prepare_python.ps1
      - name: Run project-aware Word audit components
        shell: powershell
        run: |
          & $env:AUDIT_PYTHON audit/common/runner_audit.py --mode formal --project-dir input/project --photo-stage $env:PHOTO_STAGE --outdir output/project
          exit $LASTEXITCODE
      - uses: ./_word_audit_upload
        if: always() && steps.transfer.outcome == 'success'
        with:
          name: word-audit-${{ github.run_id }}
          path: audit-${{ github.run_id }}/output/project/
          if-no-files-found: warn
