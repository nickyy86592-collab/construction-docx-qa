name: Generic audit synchronization checks
on:
  push:
    branches: [main]
    paths: ['audit/common/**', 'input/project/*页数硬审*.py', '.github/workflows/audit-sync-check.yml']
  pull_request:
    paths: ['audit/common/**', 'input/project/*页数硬审*.py', '.github/workflows/audit-sync-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow python-docx PyYAML
      - name: Compile generic scripts
        run: python -m compileall -q audit/common
      - name: Test runtime project replacement and audit gates
        run: python audit/common/tests/test_generic_audit.py
