name: Generic audit synchronization checks
on:
  push:
    branches: [main]
    paths: ['audit/common/**', 'input/project/*页数硬审*.py', '.github/workflows/audit-sync-check.yml']
  pull_request:
    paths: ['audit/common/**', 'input/project/*页数硬审*.py', '.github/workflows/audit-sync-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow python-docx PyYAML pypdf openpyxl xlrd
      - name: Compile generic scripts
        run: python -m compileall -q audit/common
      - name: Test graphics, provenance, delivery, and runtime project replacement
        run: python audit/common/tests/test_generic_audit.py
      - name: Test long-document content planning, sample and module gates
        run: python audit/common/tests/test_long_document.py

      - name: Test adaptive front matter, editorial language, and module scoring review
        run: python audit/common/tests/test_upgrade.py --report upgrade-portable.json
      - name: Test table alignment, inherited indents, widths and exceptions
        run: python audit/common/tests/test_table_layout.py --report table-portable.json
      - name: Test original-source coverage and substantive response gates
        run: python audit/common/tests/test_source_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-word-test-input-${{ github.run_id }}
          path: audit/common/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-portable-${{ github.run_id }}
          path: |
            upgrade-portable.json
            table-portable.json
          retention-days: 14
          if-no-files-found: error
  native-format-regression:
    needs: portable-regression
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: upgrade-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-word-test-input-${{ github.run_id }}
          path: upgrade-${{ github.run_id }}/audit/common
      - name: Prepare cached Python and Word COM
        shell: powershell
        run: audit/common/prepare_python.ps1
      - name: Verify adaptive front matter in actual Microsoft Word
        shell: powershell
        run: |
          & $env:AUDIT_PYTHON audit/common/tests/test_upgrade.py --word --report upgrade-word.json
          exit $LASTEXITCODE
      - name: Verify table layout in actual Microsoft Word
        shell: powershell
        run: |
          & $env:AUDIT_PYTHON audit/common/tests/test_table_layout.py --word --report table-word.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-native-word-${{ github.run_id }}
          path: |
            upgrade-${{ github.run_id }}/upgrade-word.json
            upgrade-${{ github.run_id }}/table-word.json
            upgrade-${{ github.run_id }}/word-table-evidence/**
            upgrade-${{ github.run_id }}/word-toc-evidence/**
          retention-days: 14
          if-no-files-found: warn


