name: Word representative sample measurement
on:
  push:
    branches: [main]
    paths: ['input/project/*页数硬审*.py', 'input/project/pilot.docx', 'audit/common/**', '.github/workflows/word-pilot-measure.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: word-pilot-measure
  cancel-in-progress: false
jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        run: |
          ready=$(python audit/common/runner_audit.py --mode pilot --project-dir input/project --check-ready)
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "PILOT_INPUT_READY=$ready"
  measure:
    needs: inputs
    if: needs.inputs.outputs.ready == 'true'
    runs-on: [self-hosted, Windows, X64, word-audit]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stage-${{ github.run_id }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: stage-${{ github.run_id }}
      - name: Prepare cached Python and Word COM
        shell: powershell
        run: audit/common/prepare_python.ps1
      - name: Measure representative sample and export Word PDF
        shell: powershell
        run: |
          $argsList = @('audit/common/runner_audit.py','--mode','pilot','--project-dir','input/project','--outdir','output/project')
          & $env:AUDIT_PYTHON @argsList
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-pilot-${{ github.run_id }}
          path: stage-${{ github.run_id }}/output/project/
          if-no-files-found: warn
