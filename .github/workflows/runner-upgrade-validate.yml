name: Validate construction runner offline updater
on:
  push:
    paths:
      - '.github/workflows/runner-upgrade-validate.yml'
      - 'automation/runner-upgrade-tests/**'
      - 'automation/runner-upgrade-offline/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and test actual copy and rollback in disposable directories
        shell: pwsh
        run: ./automation/runner-upgrade-tests/Test-ConstructionRunnerUpgrade.ps1
